services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # macOS may reserve host port 5000 for AirPlay/AirTunes.
      - "5050:5000"
    environment:
      MUSICCRS_HOST: 0.0.0.0
      MUSICCRS_PORT: "5000"
      MUSICCRS_RETRIEVAL_ARTIFACT: /app/retrieval/artifacts/final_retrieval.json
      HF_HOME: /app/cache/huggingface
      HF_DATASETS_CACHE: /app/cache/huggingface/datasets
      MUSICCRS_USE_LLM: ${MUSICCRS_USE_LLM:-false}
      OLLAMA_HOST: ${OLLAMA_HOST:-https://ollama.ux.uis.no}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.3:70b}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OMP_NUM_THREADS: ${MUSICCRS_CPU_THREADS:-4}
    volumes:
      # Download the catalog, embeddings, and MiniLM/Qwen weights here on
      # first start, then reuse them without requiring a host cache folder.
      - musiccrs_cache:/app/cache
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/socket.io/?EIO=4&transport=polling', timeout=4).read()"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10m

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      BROWSER: none
      REACT_APP_BACKEND_URL: http://127.0.0.1:5050
      WDS_SOCKET_PORT: "3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  musiccrs_cache:
  frontend_node_modules:
